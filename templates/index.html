<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatekeeper - Protocol Gateway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #4CAF50;
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-info {
            background: #2196F3;
            color: white;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .rules-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .rule-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .rule-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .rule-item.disabled {
            border-left-color: #999;
            opacity: 0.7;
        }

        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .rule-name {
            font-weight: 700;
            color: #333;
            font-size: 1.1em;
        }

        .rule-protocol {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .rule-details {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .rule-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status-running {
            background: #d4edda;
            color: #155724;
        }

        .status-stopped {
            background: #f8d7da;
            color: #721c24;
        }

        .rule-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state i {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .close-modal:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Gatekeeper</h1>
            <p class="subtitle">Protocol Gateway & Port Forwarding Manager</p>
        </header>

        <div class="dashboard">
            <!-- Add Rule Form -->
            <div class="card">
                <h2>Add New Forwarding Rule</h2>
                <div id="alertBox" class="alert"></div>
                <form id="ruleForm">
                    <div class="form-group">
                        <label for="ruleName">Rule Name *</label>
                        <input type="text" id="ruleName" placeholder="e.g., RDP Access" required>
                    </div>

                    <div class="form-group">
                        <label for="gatewayPort">Gateway Port *</label>
                        <input type="number" id="gatewayPort" placeholder="e.g., 3389" min="1" max="65535" required>
                    </div>

                    <div class="form-group">
                        <label for="targetHost">Target Host IP *</label>
                        <input type="text" id="targetHost" placeholder="e.g., 192.168.1.100" required>
                    </div>

                    <div class="form-group">
                        <label for="targetPort">Target Port *</label>
                        <input type="number" id="targetPort" placeholder="e.g., 3389" min="1" max="65535" required>
                    </div>

                    <div class="form-group">
                        <label for="protocol">Protocol *</label>
                        <select id="protocol" required>
                            <option value="rdp">RDP (Remote Desktop)</option>
                            <option value="ssh">SSH</option>
                            <option value="vnc">VNC</option>
                            <option value="http">HTTP</option>
                            <option value="https">HTTPS</option>
                            <option value="custom">Custom TCP</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="enabled" checked> Enable immediately
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Rule</button>
                    <button type="button" class="btn btn-info" onclick="startAll()">Start All</button>
                    <button type="button" class="btn btn-warning" onclick="stopAll()">Stop All</button>
                </form>
            </div>

            <!-- Statistics -->
            <div class="card">
                <h2>Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalRules">0</div>
                        <div class="stat-label">Total Rules</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="activeForwards">0</div>
                        <div class="stat-label">Active Forwards</div>
                    </div>
                </div>

                <h2 style="margin-top: 30px;">Quick Actions</h2>
                <button class="btn btn-info btn-small" onclick="loadRules()">🔄 Refresh</button>
                <button class="btn btn-success btn-small" onclick="startAll()">▶️ Start All</button>
                <button class="btn btn-danger btn-small" onclick="stopAll()">⏹️ Stop All</button>
            </div>
        </div>

        <!-- Rules List -->
        <div class="card">
            <h2>Active Forwarding Rules</h2>
            <div id="rulesList" class="rules-list">
                <div class="empty-state">
                    <p>Loading rules...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Rule</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editRuleId">
                <div class="form-group">
                    <label for="editRuleName">Rule Name</label>
                    <input type="text" id="editRuleName" required>
                </div>
                <div class="form-group">
                    <label for="editGatewayPort">Gateway Port</label>
                    <input type="number" id="editGatewayPort" min="1" max="65535" required>
                </div>
                <div class="form-group">
                    <label for="editTargetHost">Target Host IP</label>
                    <input type="text" id="editTargetHost" required>
                </div>
                <div class="form-group">
                    <label for="editTargetPort">Target Port</label>
                    <input type="number" id="editTargetPort" min="1" max="65535" required>
                </div>
                <div class="form-group">
                    <label for="editProtocol">Protocol</label>
                    <select id="editProtocol" required>
                        <option value="rdp">RDP</option>
                        <option value="ssh">SSH</option>
                        <option value="vnc">VNC</option>
                        <option value="http">HTTP</option>
                        <option value="https">HTTPS</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <button type="button" class="btn btn-danger" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        let currentRules = [];

        // Load rules on page load
        document.addEventListener('DOMContentLoaded', loadRules);

        // Auto-refresh every 5 seconds
        setInterval(loadRules, 5000);

        async function loadRules() {
            try {
                const response = await fetch('/api/rules');
                const data = await response.json();
                currentRules = data.rules || [];
                renderRules(currentRules);
                updateStats(data);
            } catch (error) {
                console.error('Error loading rules:', error);
                showAlert('Error loading rules: ' + error.message, 'error');
            }
        }

        function renderRules(rules) {
            const container = document.getElementById('rulesList');
            
            if (rules.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No forwarding rules configured yet.</p>
                        <p>Add your first rule using the form above!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = rules.map(rule => `
                <div class="rule-item ${!rule.enabled ? 'disabled' : ''}">
                    <div class="rule-header">
                        <span class="rule-name">${escapeHtml(rule.name)}</span>
                        <span class="rule-protocol">${escapeHtml(rule.protocol)}</span>
                    </div>
                    <div class="rule-status ${rule.is_running ? 'status-running' : 'status-stopped'}">
                        ${rule.is_running ? '● Running' : '○ Stopped'}
                    </div>
                    <div class="rule-details">
                        <strong>Gateway:</strong> 0.0.0.0:${rule.gateway_port}<br>
                        <strong>Target:</strong> ${rule.target_host}:${rule.target_port}<br>
                        <strong>Status:</strong> ${rule.enabled ? 'Enabled' : 'Disabled'}<br>
                        <strong>Created:</strong> ${new Date(rule.created_at).toLocaleString()}
                    </div>
                    <div class="rule-actions">
                        <button class="btn btn-small ${rule.enabled ? 'btn-warning' : 'btn-success'}" 
                                onclick="toggleRule(${rule.id})">
                            ${rule.enabled ? '⏸️ Disable' : '▶️ Enable'}
                        </button>
                        <button class="btn btn-small btn-info" onclick="restartRule(${rule.id})">
                            🔄 Restart
                        </button>
                        <button class="btn btn-small btn-primary" onclick="editRule(${rule.id})">
                            ✏️ Edit
                        </button>
                        <button class="btn btn-small btn-danger" onclick="deleteRule(${rule.id})">
                            🗑️ Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(data) {
            document.getElementById('totalRules').textContent = data.total_rules || 0;
            document.getElementById('activeForwards').textContent = data.active_forwards || 0;
        }

        // Add new rule
        document.getElementById('ruleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ruleData = {
                name: document.getElementById('ruleName').value,
                gateway_port: parseInt(document.getElementById('gatewayPort').value),
                target_host: document.getElementById('targetHost').value,
                target_port: parseInt(document.getElementById('targetPort').value),
                protocol: document.getElementById('protocol').value,
                enabled: document.getElementById('enabled').checked
            };

            try {
                const response = await fetch('/api/rules', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ruleData)
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Rule added successfully!', 'success');
                    document.getElementById('ruleForm').reset();
                    loadRules();
                } else {
                    showAlert('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Error adding rule: ' + error.message, 'error');
            }
        });

        // Toggle rule
        async function toggleRule(ruleId) {
            try {
                const response = await fetch(`/api/rules/${ruleId}/toggle`, {
                    method: 'POST'
                });

                if (response.ok) {
                    loadRules();
                    showAlert('Rule toggled successfully!', 'success');
                } else {
                    const result = await response.json();
                    showAlert('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Error toggling rule: ' + error.message, 'error');
            }
        }

        // Restart rule
        async function restartRule(ruleId) {
            try {
                const response = await fetch(`/api/rules/${ruleId}/restart`, {
                    method: 'POST'
                });

                if (response.ok) {
                    loadRules();
                    showAlert('Rule restarted successfully!', 'success');
                } else {
                    const result = await response.json();
                    showAlert('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Error restarting rule: ' + error.message, 'error');
            }
        }

        // Delete rule
        async function deleteRule(ruleId) {
            if (!confirm('Are you sure you want to delete this rule?')) {
                return;
            }

            try {
                const response = await fetch(`/api/rules/${ruleId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadRules();
                    showAlert('Rule deleted successfully!', 'success');
                } else {
                    const result = await response.json();
                    showAlert('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Error deleting rule: ' + error.message, 'error');
            }
        }

        // Start all rules
        async function startAll() {
            try {
                const response = await fetch('/api/start-all', {
                    method: 'POST'
                });

                if (response.ok) {
                    loadRules();
                    showAlert('All rules started!', 'success');
                } else {
                    const result = await response.json();
                    showAlert('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Error starting rules: ' + error.message, 'error');
            }
        }

        // Stop all rules
        async function stopAll() {
            try {
                const response = await fetch('/api/stop-all', {
                    method: 'POST'
                });

                if (response.ok) {
                    loadRules();
                    showAlert('All rules stopped!', 'success');
                } else {
                    const result = await response.json();
                    showAlert('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Error stopping rules: ' + error.message, 'error');
            }
        }

        // Edit rule
        function editRule(ruleId) {
            const rule = currentRules.find(r => r.id === ruleId);
            if (!rule) return;

            document.getElementById('editRuleId').value = rule.id;
            document.getElementById('editRuleName').value = rule.name;
            document.getElementById('editGatewayPort').value = rule.gateway_port;
            document.getElementById('editTargetHost').value = rule.target_host;
            document.getElementById('editTargetPort').value = rule.target_port;
            document.getElementById('editProtocol').value = rule.protocol;

            document.getElementById('editModal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // Save edited rule
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ruleId = parseInt(document.getElementById('editRuleId').value);
            const ruleData = {
                name: document.getElementById('editRuleName').value,
                gateway_port: parseInt(document.getElementById('editGatewayPort').value),
                target_host: document.getElementById('editTargetHost').value,
                target_port: parseInt(document.getElementById('editTargetPort').value),
                protocol: document.getElementById('editProtocol').value
            };

            try {
                const response = await fetch(`/api/rules/${ruleId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ruleData)
                });

                const result = await response.json();

                if (response.ok) {
                    closeModal();
                    loadRules();
                    showAlert('Rule updated successfully!', 'success');
                } else {
                    showAlert('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Error updating rule: ' + error.message, 'error');
            }
        });

        // Show alert
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('editModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
